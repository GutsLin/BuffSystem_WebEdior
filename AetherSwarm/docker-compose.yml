services:
  aetherswarm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aetherswarm-game
    restart: unless-stopped
    ports:
      - "${GAME_PORT:-3001}:3001"
    environment:
      PORT: 3001
    volumes:
      - aetherswarm-data:/app/data

volumes:
  aetherswarm-data:
